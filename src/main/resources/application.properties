spring.application.name=verifyflow

# Local development database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verifyflow}
spring.datasource.username=${DB_USERNAME:verifyflow}
spring.datasource.password=${DB_PASSWORD:verifyflow_dev}

# Flyway owns the database schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Safe actuator exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=VerifyFlow
info.app.description=KYC integration and manual-review workflow
info.app.version=0.0.1

# Never expose stack traces in HTTP responses
server.error.include-stacktrace=never
server.error.include-message=never