name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 21 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: verifyflow
          POSTGRES_USER: verifyflow
          POSTGRES_PASSWORD: verifyflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifyflow -d verifyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/verifyflow
      DB_USERNAME: verifyflow
      DB_PASSWORD: verifyflow_ci
      WEBHOOK_SECRET: ci-only-webhook-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run test suite
        run: ./mvnw --batch-mode --no-transfer-progress clean test